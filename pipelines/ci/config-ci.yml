# ---------------------------------------------------------------------------------------------------------------------
# DATABRICKS CONFIGURATION - CI PIPELINE
# Runs on pull requests: validation, security scanning, and unit tests
# ---------------------------------------------------------------------------------------------------------------------

trigger: none

pr:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - terraform-modules/azure/databricks/configuration/**
      - deployments/databricks-config/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: moduleDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform-modules/azure/databricks/configuration'
  - name: deploymentDirectory
    value: '$(System.DefaultWorkingDirectory)/deployments/databricks-config'

stages:
  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Validate
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: Validate
    displayName: '🔍 Validate'
    jobs:
      - job: TerraformValidate
        displayName: 'Terraform Validate & Format'
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: Bash@3
            displayName: 'Terraform Format Check'
            inputs:
              targetType: inline
              script: |
                terraform fmt -check -recursive -diff $(moduleDirectory)
                terraform fmt -check -recursive -diff $(deploymentDirectory)

          - task: Bash@3
            displayName: 'Terraform Init & Validate (Module)'
            inputs:
              targetType: inline
              workingDirectory: $(moduleDirectory)
              script: |
                terraform init -backend=false
                terraform validate

          - task: Bash@3
            displayName: 'Terraform Init & Validate (Deployment)'
            inputs:
              targetType: inline
              workingDirectory: $(deploymentDirectory)
              script: |
                terraform init -backend=false
                terraform validate

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Security Scan
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: SecurityScan
    displayName: '🔒 Security Scan'
    dependsOn: Validate
    jobs:
      - job: SecurityScan
        displayName: 'tfsec & Checkov'
        steps:
          - checkout: self

          - template: ../templates/security-scan.yml
            parameters:
              workingDirectory: $(moduleDirectory)
              failOnHighSeverity: true

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Unit Tests
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: UnitTests
    displayName: '🧪 Unit Tests'
    dependsOn: Validate
    jobs:
      - job: RunUnitTests
        displayName: 'Terratest Unit Tests'
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - template: ../templates/run-tests.yml
            parameters:
              moduleDirectory: $(moduleDirectory)
              runIntegrationTests: false
