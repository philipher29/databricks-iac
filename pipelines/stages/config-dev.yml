# ---------------------------------------------------------------------------------------------------------------------
# DATABRICKS CONFIGURATION - DEV DEPLOYMENT
# Controlled version deployment for developers
# Trigger: Manual only (with version/commit selection)
# Approval: None required
# Dependency: Requires workspace to be deployed first
# ---------------------------------------------------------------------------------------------------------------------

trigger: none  # Manual trigger only
pr: none

pool:
  vmImage: 'ubuntu-latest'

# ---------------------------------------------------------------------------------------------------------------------
# PARAMETERS - Version Selection
# ---------------------------------------------------------------------------------------------------------------------

parameters:
  - name: deploymentSource
    displayName: 'Deployment Source'
    type: string
    default: 'promoteFromIT'
    values:
      - promoteFromIT      # Deploy same version as IT
      - specificCommit     # Deploy specific git commit
      - specificVersion    # Deploy specific version tag

  - name: sourceCommit
    displayName: 'Git Commit SHA (if specificCommit selected)'
    type: string
    default: ''

  - name: sourceVersion
    displayName: 'Version Tag (if specificVersion selected)'
    type: string
    default: ''

  - name: skipITVerification
    displayName: 'Skip IT Deployment Verification (emergency only)'
    type: boolean
    default: false

# ---------------------------------------------------------------------------------------------------------------------
# VARIABLES
# ---------------------------------------------------------------------------------------------------------------------

variables:
  - group: terraform-backend
  - group: databricks-dev
  - name: environment
    value: 'dev'
  - name: moduleName
    value: 'databricks-config'
  - name: moduleDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform-modules/azure/databricks/configuration'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/deployments/databricks-config'

stages:
  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Pre-Check
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: PreCheck
    displayName: '🔍 Pre-Check'
    jobs:
      - job: VerifyWorkspace
        displayName: 'Verify Workspace Deployed'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Check Workspace Status'
            inputs:
              targetType: inline
              script: |
                MANIFEST="deployments/tracking/deployment-manifest.json"
                WS_STATUS=$(jq -r '.deployments["databricks-workspace"]["dev"].status' "$MANIFEST")

                echo "Workspace status in DEV: $WS_STATUS"

                if [ "$WS_STATUS" != "deployed" ]; then
                  echo "##vso[task.logissue type=error]Workspace must be deployed before configuration. Current status: $WS_STATUS"
                  echo "##vso[task.logissue type=error]Run workspace-dev.yml first"
                  exit 1
                fi

                echo "✅ Workspace is deployed, proceeding with configuration"

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Resolve Version
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: ResolveVersion
    displayName: '🔍 Resolve Deployment Version'
    dependsOn: PreCheck
    jobs:
      - job: DetermineVersion
        displayName: 'Determine Version to Deploy'
        steps:
          - checkout: self
            fetchDepth: 0  # Full history for version lookup

          - task: Bash@3
            displayName: 'Show Available Versions'
            inputs:
              targetType: inline
              script: |
                echo "=== Deployment Manifest Status ==="
                MANIFEST="deployments/tracking/deployment-manifest.json"

                echo ""
                echo "📦 Current Environment Status:"
                echo "--------------------------------"
                jq -r '.deployments["databricks-config"] | to_entries[] | "  \(.key): \(.value.status) - v\(.value.version // "none") (\(.value.commitSha // "N/A" | .[0:8]))"' "$MANIFEST"

                echo ""
                echo "🏷️ Recent Tags (Versions):"
                echo "--------------------------------"
                git tag -l --sort=-creatordate | head -10 | while read tag; do
                  echo "  $tag"
                done

          - task: Bash@3
            displayName: 'Resolve Source Version'
            name: resolveVersion
            inputs:
              targetType: inline
              script: |
                set -e
                MANIFEST="deployments/tracking/deployment-manifest.json"

                # Get IT deployment info
                IT_STATUS=$(jq -r '.deployments["databricks-config"]["it"].status' "$MANIFEST")
                IT_VERSION=$(jq -r '.deployments["databricks-config"]["it"].version' "$MANIFEST")
                IT_COMMIT=$(jq -r '.deployments["databricks-config"]["it"].commitSha' "$MANIFEST")

                echo "=== IT Environment Status ==="
                echo "Status: $IT_STATUS"
                echo "Version: $IT_VERSION"
                echo "Commit: $IT_COMMIT"
                echo "=============================="

                # Verify IT is deployed (unless skipped for emergency)
                if [ "${{ parameters.skipITVerification }}" != "True" ]; then
                  if [ "$IT_STATUS" != "deployed" ]; then
                    echo "##vso[task.logissue type=error]IT must be deployed before DEV. Current status: $IT_STATUS"
                    echo "##vso[task.logissue type=error]Run config-it.yml first or use skipITVerification for emergency."
                    exit 1
                  fi
                else
                  echo "##vso[task.logissue type=warning]IT verification skipped (emergency mode)"
                fi

                # Resolve target based on deployment source
                case "${{ parameters.deploymentSource }}" in
                  "promoteFromIT")
                    if [ "$IT_STATUS" != "deployed" ] || [ "$IT_COMMIT" == "null" ]; then
                      echo "##vso[task.logissue type=error]Cannot promote from IT - no valid deployment found"
                      exit 1
                    fi
                    TARGET_COMMIT="$IT_COMMIT"
                    TARGET_VERSION="$IT_VERSION"
                    PROMOTED_FROM="it"
                    DEPLOY_SOURCE="promoteFromIT"
                    echo "✅ Promoting version from IT: $IT_VERSION"
                    ;;

                  "specificCommit")
                    TARGET_COMMIT="${{ parameters.sourceCommit }}"
                    if [ -z "$TARGET_COMMIT" ]; then
                      echo "##vso[task.logissue type=error]sourceCommit parameter is required when using specificCommit"
                      exit 1
                    fi
                    # Verify commit exists
                    if ! git cat-file -t "$TARGET_COMMIT" >/dev/null 2>&1; then
                      echo "##vso[task.logissue type=error]Commit $TARGET_COMMIT not found in repository"
                      exit 1
                    fi
                    TARGET_VERSION="commit:${TARGET_COMMIT:0:8}"
                    PROMOTED_FROM=""
                    DEPLOY_SOURCE="specificCommit"
                    echo "✅ Using specific commit: $TARGET_COMMIT"
                    ;;

                  "specificVersion")
                    TAG="${{ parameters.sourceVersion }}"
                    if [ -z "$TAG" ]; then
                      echo "##vso[task.logissue type=error]sourceVersion parameter is required when using specificVersion"
                      exit 1
                    fi
                    TARGET_COMMIT=$(git rev-parse "$TAG" 2>/dev/null || echo "")
                    if [ -z "$TARGET_COMMIT" ]; then
                      echo "##vso[task.logissue type=error]Version tag $TAG not found in repository"
                      echo "Available tags:"
                      git tag -l | head -20
                      exit 1
                    fi
                    TARGET_VERSION="$TAG"
                    PROMOTED_FROM=""
                    DEPLOY_SOURCE="specificVersion"
                    echo "✅ Using version tag: $TAG -> $TARGET_COMMIT"
                    ;;

                  *)
                    echo "##vso[task.logissue type=error]Unknown deployment source: ${{ parameters.deploymentSource }}"
                    exit 1
                    ;;
                esac

                # Set output variables
                echo "##vso[task.setvariable variable=targetCommit;isOutput=true]$TARGET_COMMIT"
                echo "##vso[task.setvariable variable=targetVersion;isOutput=true]$TARGET_VERSION"
                echo "##vso[task.setvariable variable=promotedFrom;isOutput=true]$PROMOTED_FROM"
                echo "##vso[task.setvariable variable=deploySource;isOutput=true]$DEPLOY_SOURCE"

                echo ""
                echo "=== Deployment Target ==="
                echo "Commit: $TARGET_COMMIT"
                echo "Version: $TARGET_VERSION"
                echo "Promoted From: ${PROMOTED_FROM:-"N/A"}"
                echo "Deploy Source: $DEPLOY_SOURCE"

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Plan
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: Plan
    displayName: '📋 Plan DEV'
    dependsOn: ResolveVersion
    variables:
      targetCommit: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.targetCommit'] ]
      targetVersion: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.targetVersion'] ]
    jobs:
      - job: TerraformPlan
        displayName: 'Terraform Plan'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: Bash@3
            displayName: 'Checkout Target Commit'
            inputs:
              targetType: inline
              script: |
                echo "Checking out commit: $(targetCommit)"
                git checkout $(targetCommit)
                echo "Current HEAD:"
                git log -1 --oneline

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - template: ../templates/terraform-init.yml
            parameters:
              workingDirectory: $(workingDirectory)
              environment: $(environment)
              backendResourceGroup: $(backendResourceGroup)
              backendStorageAccount: $(backendStorageAccount)
              backendContainer: 'tfstate-$(environment)'
              backendKey: '$(moduleName).tfstate'
              managedIdentityClientId: $(managed-identity-client-id)

          - template: ../templates/terraform-plan.yml
            parameters:
              workingDirectory: $(workingDirectory)
              environment: $(environment)
              subscriptionId: $(subscription-id)
              managedIdentityClientId: $(managed-identity-client-id)
              tfvarsFiles:
                - environments/common.tfvars
                - environments/$(environment).tfvars

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Apply
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: Apply
    displayName: '🚀 Apply DEV'
    dependsOn:
      - ResolveVersion
      - Plan
    condition: succeeded()
    variables:
      targetCommit: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.targetCommit'] ]
      targetVersion: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.targetVersion'] ]
      promotedFrom: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.promotedFrom'] ]
      deploySource: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.deploySource'] ]
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        environment: 'databricks-config-dev'  # No approval configured
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - task: Bash@3
                  displayName: 'Checkout Target Commit'
                  inputs:
                    targetType: inline
                    script: |
                      git checkout $(targetCommit)
                      echo "Deploying commit: $(targetCommit)"

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                - template: ../templates/terraform-init.yml
                  parameters:
                    workingDirectory: $(workingDirectory)
                    environment: $(environment)
                    backendResourceGroup: $(backendResourceGroup)
                    backendStorageAccount: $(backendStorageAccount)
                    backendContainer: 'tfstate-$(environment)'
                    backendKey: '$(moduleName).tfstate'
                    managedIdentityClientId: $(managed-identity-client-id)

                - template: ../templates/terraform-apply.yml
                  parameters:
                    workingDirectory: $(workingDirectory)
                    environment: $(environment)
                    subscriptionId: $(subscription-id)
                    managedIdentityClientId: $(managed-identity-client-id)

                - template: ../templates/version-management.yml
                  parameters:
                    moduleName: $(moduleName)
                    moduleDirectory: $(moduleDirectory)
                    environment: $(environment)

  # ---------------------------------------------------------------------------------------------------------------------
  # STAGE: Post-Deploy
  # ---------------------------------------------------------------------------------------------------------------------
  - stage: PostDeploy
    displayName: '✅ Post-Deploy DEV'
    dependsOn: Apply
    condition: succeeded()
    variables:
      targetVersion: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.targetVersion'] ]
      promotedFrom: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.promotedFrom'] ]
      deploySource: $[ stageDependencies.ResolveVersion.DetermineVersion.outputs['resolveVersion.deploySource'] ]
    jobs:
      - job: Notify
        displayName: 'Notify Developers'
        steps:
          - task: Bash@3
            displayName: 'Deployment Summary'
            inputs:
              targetType: inline
              script: |
                echo "=============================================="
                echo "🚀 DEV CONFIGURATION DEPLOYMENT COMPLETE"
                echo "=============================================="
                echo "Version: $(targetVersion)"
                echo "Promoted From: $(promotedFrom)"
                echo "Deploy Source: $(deploySource)"
                echo "Deployed By: $(Build.RequestedFor)"
                echo "Build: $(Build.BuildNumber)"
                echo "=============================================="
                echo ""
                echo "Developers can now use this configuration."
