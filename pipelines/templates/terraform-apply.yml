# ---------------------------------------------------------------------------------------------------------------------
# TERRAFORM APPLY TEMPLATE
# Reusable template for Terraform apply operations
# ---------------------------------------------------------------------------------------------------------------------

parameters:
  - name: workingDirectory
    type: string
  - name: environment
    type: string
  - name: subscriptionId
    type: string
  - name: managedIdentityClientId
    type: string

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Plan Artifact'
    inputs:
      buildType: 'current'
      artifactName: 'tfplan-${{ parameters.environment }}'
      targetPath: '${{ parameters.workingDirectory }}'

  - task: AzureCLI@2
    displayName: 'Terraform Apply'
    inputs:
      azureSubscription: ${{ parameters.environment }}-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: ${{ parameters.workingDirectory }}
      addSpnToEnvironment: false
      inlineScript: |
        # Use managed identity
        export ARM_USE_MSI=true
        export ARM_CLIENT_ID=${{ parameters.managedIdentityClientId }}
        export ARM_SUBSCRIPTION_ID=${{ parameters.subscriptionId }}

        # Apply the saved plan
        terraform apply \
          -input=false \
          -auto-approve \
          tfplan

        # Output results
        echo "##[section]Terraform Outputs"
        terraform output -json > outputs.json
        cat outputs.json

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Outputs'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/outputs.json'
      artifact: 'outputs-${{ parameters.environment }}'
      publishLocation: 'pipeline'
